<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Logo: bandera de Hoyales de Roa (amarillo y rojo, con el escudo en el centro) -->
  <defs>
    <clipPath id="c"><rect width="100" height="100" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="100" height="50" fill="#f6c315"/>
    <rect y="50" width="100" height="50" fill="#c8102e"/>
    <!-- ondas de bandera -->
    <path d="M0 50 Q25 44 50 50 T100 50" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
  </g>

  <!-- corona real cerrada -->
  <g stroke="#7a5410" stroke-width="1" stroke-linejoin="round">
    <path d="M35 29 L33 19 L41 23 L50 15 L59 23 L67 19 L65 29 Z" fill="#f2c14e"/>
    <rect x="34.5" y="28" width="31" height="4.5" rx="1" fill="#e2a83a"/>
    <circle cx="50" cy="12.5" r="2.6" fill="#f2c14e"/>
    <path d="M50 7 V10 M48.5 8.3 H51.5" stroke-width="1.2"/>
  </g>
  <g fill="#c8102e"><circle cx="42" cy="30.2" r="1"/><circle cx="58" cy="30.2" r="1"/></g>
  <circle cx="50" cy="30.2" r="1.2" fill="#2e6fb5"/>

  <!-- escudo: de gules, castillo de oro, estrellas de plata sobre las torres -->
  <path d="M31 34 H69 V60 A19 19 0 0 1 31 60 Z" fill="#c8102e" stroke="#f2c14e" stroke-width="2.6"/>
  <path d="M31 34 H69 V60 A19 19 0 0 1 31 60 Z" fill="none" stroke="#7a5410" stroke-width=".8"/>
  <g fill="#f2c14e" stroke="#7a5410" stroke-width=".7" stroke-linejoin="round">
    <!-- cuerpo -->
    <path d="M37 72 V57 h2 v-2 h2 v2 h2 v-2 h2 v2 h10 v-2 h2 v2 h2 v-2 h2 v2 h2 V72 Z"/>
    <!-- torre central -->
    <path d="M45 57 V46 h2 v-2 h2 v2 h2 v-2 h2 v2 h2 V57 Z"/>
    <!-- torres laterales -->
    <path d="M38 57 V51 h1.5 v-1.5 h1.5 v1.5 h1.5 v-1.5 h1.5 v1.5 h1 V57 Z"/>
    <path d="M55 57 V51 h1.5 v-1.5 h1.5 v1.5 h1.5 v-1.5 h1.5 v1.5 h1 V57 Z"/>
  </g>
  <g fill="#2e6fb5">
    <path d="M47.5 72 V66 a2.5 2.5 0 0 1 5 0 V72 Z"/>
    <rect x="49" y="49" width="2" height="3.5" rx="1"/>
  </g>
  <!-- estrellas -->
  <g fill="#ffffff" stroke="#9aa3ad" stroke-width=".4">
    <path id="st" d="M50 37.2 l1.06 2.15 2.37 .35 -1.72 1.67 .41 2.36 -2.12 -1.11 -2.12 1.11 .41 -2.36 -1.72 -1.67 2.37 -.35 Z"/>
    <use href="#st" x="-9" y="6"/>
    <use href="#st" x="9" y="6"/>
  </g>
</svg>
